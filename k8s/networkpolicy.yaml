apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: healthcare
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app
  namespace: healthcare
spec:
  podSelector:
    matchLabels:
      app: healthcare
  ingress:
  - ports:
    - port: 3000
